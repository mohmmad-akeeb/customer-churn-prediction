version: '3.8'

services:
  churn-prediction:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-churn-prediction
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEBUG=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - churn-network

networks:
  churn-network:
    driver: bridge
