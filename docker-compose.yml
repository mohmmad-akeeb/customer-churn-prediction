version: '3.8'

services:
  churn-prediction:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-churn-prediction
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEBUG=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Optional: Mount for development
      # - ./templates:/app/templates:ro
      # - ./best_model_pipeline.pkl:/app/best_model_pipeline.pkl:ro
    networks:
      - churn-network

networks:
  churn-network:
    driver: bridge
